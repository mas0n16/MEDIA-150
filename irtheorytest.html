<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POLSC 120 &mdash; Midterm 3 Quiz</title>
<style>
:root {
  --bg: #f5f2ec;
  --surface: #ffffff;
  --surface2: #f0ede6;
  --border: #ddd9d0;
  --border-strong: #b8b2a7;
  --ink: #1a1814;
  --ink2: #4a4640;
  --ink3: #8a8480;
  --accent: #1a3a5c;
  --accent-light: #e8eef5;
  --accent-mid: #2d5a8e;
  --success: #1a6b3a;
  --success-bg: #eaf5ee;
  --danger: #8b1a1a;
  --danger-bg: #faeaea;
  --warn: #5c4a00;
  --warn-bg: #fdf6e3;
  --tag-combined: #2d4a7a;
  --tag-exam: #1a5c3a;
  --tag-m3: #5c2d6b;
  --tag-review: #7a4a00;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  min-height: 100vh;
  font-size: 16px;
  line-height: 1.6;
}

/* &#9472;&#9472; TOP BAR &#9472;&#9472; */
.top-bar {
  background: var(--ink);
  color: #fff;
  padding: 0 2rem;
  height: 3rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.top-bar-label {
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', 'Courier New', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  opacity: 0.7;
}
.top-bar-mode {
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', 'Courier New', monospace;
  font-size: 0.7rem;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  background: rgba(255,255,255,0.12);
  padding: 0.2rem 0.7rem;
  border-radius: 2px;
}
.top-bar-mode.mode-combined { background: rgba(45,74,122,0.5); }
.top-bar-mode.mode-exam     { background: rgba(26,92,58,0.5); }
.top-bar-mode.mode-m3       { background: rgba(92,45,107,0.5); }
.top-bar-mode.mode-review   { background: rgba(122,74,0,0.5); }

/* &#9472;&#9472; HEADER &#9472;&#9472; */
header {
  background: var(--surface);
  border-bottom: 2px solid var(--ink);
  padding: 1.5rem 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1.2rem;
}
.header-left {}
.header-title {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: clamp(1.6rem, 3.5vw, 2.4rem);
  font-weight: 400;
  line-height: 1.1;
  color: var(--ink);
  letter-spacing: -0.01em;
}
.header-title em {
  font-style: italic;
  color: var(--accent-mid);
}
.header-sub {
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', 'Courier New', monospace;
  font-size: 0.65rem;
  color: var(--ink3);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-top: 0.3rem;
}
.header-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 0.8rem;
  min-width: 0;
}

/* &#9472;&#9472; VERSION TABS &#9472;&#9472; */
.version-tabs {
  display: flex;
  gap: 0.3rem;
  background: var(--surface2);
  padding: 0.25rem;
  border-radius: 6px;
  border: 1px solid var(--border);
}
.v-btn {
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', 'Courier New', monospace;
  font-size: 0.68rem;
  font-weight: 500;
  padding: 0.4rem 0.9rem;
  background: transparent;
  border: none;
  border-radius: 4px;
  color: var(--ink3);
  cursor: pointer;
  transition: all 0.15s ease;
  letter-spacing: 0.04em;
}
.v-btn:hover:not(.active) { background: var(--border); color: var(--ink2); }
.v-btn.active { color: #fff; font-weight: 500; }
.v-btn.active.v0-btn { background: var(--tag-combined); }
.v-btn.active.v7-btn { background: var(--tag-exam); }
.v-btn.active.v6-btn { background: var(--tag-m3); }
.v-btn.active.v8-btn { background: var(--tag-review); }

/* &#9472;&#9472; SCORE BADGE &#9472;&#9472; */
.score-badge {
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', 'Courier New', monospace;
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--ink);
  background: var(--surface2);
  border: 1px solid var(--border-strong);
  padding: 0.35rem 1rem;
  border-radius: 4px;
  min-width: 0;
  text-align: center;
}

/* &#9472;&#9472; PROGRESS BAR &#9472;&#9472; */
.progress-bar-wrap {
  background: var(--border);
  height: 3px;
  width: 100%;
}
.progress-bar {
  height: 100%;
  background: var(--accent);
  transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
}

/* &#9472;&#9472; MAIN LAYOUT &#9472;&#9472; */
main { max-width: 760px; margin: 0 auto; padding: 2.5rem 1.5rem; }
#intro { text-align: left; }

/* &#9472;&#9472; INTRO SECTIONS &#9472;&#9472; */
.section-heading {
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', 'Courier New', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink3);
  margin-bottom: 0.75rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.section-heading::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}
.picker-section { margin-bottom: 2rem; }

/* &#9472;&#9472; BANK TOGGLES &#9472;&#9472; */
.combine-box { margin-bottom: 2rem; display: none; }
.check-item {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  background: var(--surface);
  border: 1.5px solid var(--border);
  padding: 0.85rem 1.1rem;
  margin-bottom: 0.4rem;
  cursor: pointer;
  transition: all 0.15s;
  border-radius: 5px;
  font-size: 0.9rem;
  color: var(--ink2);
  user-select: none;
}
.check-item:hover { border-color: var(--accent-mid); background: var(--accent-light); }
.check-item.checked { border-color: var(--accent); background: var(--accent-light); color: var(--ink); font-weight: 500; }
.check-icon {
  width: 1.1rem;
  height: 1.1rem;
  border: 1.5px solid var(--border-strong);
  border-radius: 3px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  font-size: 0.7rem;
  transition: all 0.15s;
}
.check-item.checked .check-icon {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

/* &#9472;&#9472; DIFFICULTY / LENGTH PICKERS &#9472;&#9472; */
.picker-grid { display: flex; gap: 0.6rem; flex-wrap: wrap; }
.pick-btn {
  flex: 1;
  min-width: 90px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  padding: 0.9rem 0.75rem;
  color: var(--ink2);
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.3rem;
  border-radius: 5px;
}
.pick-btn:hover:not(.active) { border-color: var(--border-strong); background: var(--surface2); }
.pick-btn.active {
  border-color: var(--accent);
  background: var(--accent-light);
  color: var(--accent);
}
.pick-num {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 1.6rem;
  line-height: 1;
  color: inherit;
}
.pick-desc {
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', 'Courier New', monospace;
  font-size: 0.58rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink3);
}
.pick-btn.active .pick-desc { color: var(--accent-mid); }

/* &#9472;&#9472; SLIDER &#9472;&#9472; */
.slider-wrap { width: 100%; }
.q-slider {
  width: 100%;
  appearance: none;
  -webkit-appearance: none;
  height: 3px;
  touch-action: pan-y;
  background: var(--border);
  outline: none;
  margin: 1.2rem 0 0.5rem;
  border-radius: 2px;
}
.q-slider::-webkit-slider-thumb {
  appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  border: 3px solid var(--surface);
  box-shadow: 0 0 0 1.5px var(--accent);
}
.slider-readout {
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', 'Courier New', monospace;
  font-size: 0.8rem;
  color: var(--ink2);
  text-align: center;
}
.slider-readout span { font-weight: 500; color: var(--ink); }

/* &#9472;&#9472; START BUTTON &#9472;&#9472; */
.btn-start {
  display: block;
  width: 100%;
  max-width: 320px;
  margin: 0.5rem auto 0;
  padding: 1rem 2rem;
  background: var(--ink);
  color: #fff;
  border: none;
  border-radius: 5px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  font-size: 0.95rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-start:hover { background: var(--accent); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(26,58,92,0.18); }

/* &#9472;&#9472; QUESTION CARD &#9472;&#9472; */
.q-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 2rem 2rem 1.5rem;
  overflow-wrap: break-word;
  margin-bottom: 1rem;
  animation: slideUp 0.3s cubic-bezier(0.4,0,0.2,1);
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

.q-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1rem;
  flex-wrap: wrap;
  gap: 0.4rem;
}
.q-num-label {
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', 'Courier New', monospace;
  font-size: 0.65rem;
  color: var(--ink3);
  letter-spacing: 0.06em;
}
.section-tag {
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', 'Courier New', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent-mid);
  background: var(--accent-light);
  padding: 0.2rem 0.6rem;
  border-radius: 3px;
}

.q-text {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 1.2rem;
  line-height: 1.55;
  color: var(--ink);
  margin-bottom: 1.5rem;
  font-weight: 400;
}

/* &#9472;&#9472; ANSWER OPTIONS &#9472;&#9472; */
.option-btn {
  width: 100%;
  text-align: left;
  padding: 0.85rem 1rem;
  background: var(--surface2);
  border: 1.5px solid var(--border);
  color: var(--ink2);
  margin-bottom: 0.5rem;
  cursor: pointer;
  transition: all 0.12s;
  font-size: 0.92rem;
  line-height: 1.45;
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  border-radius: 5px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  word-break: break-word;
  hyphens: auto;
}
.option-btn:hover:not(:disabled) {
  border-color: var(--accent-mid);
  background: var(--accent-light);
  color: var(--ink);
}
.option-letter {
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', 'Courier New', monospace;
  font-size: 0.7rem;
  font-weight: 500;
  width: 1.4rem;
  height: 1.4rem;
  border-radius: 3px;
  background: var(--border);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  margin-top: 0.05rem;
  color: var(--ink3);
  letter-spacing: 0;
}

/* States */
.selected-m {
  border-color: var(--accent-mid);
  background: var(--accent-light);
  color: var(--ink);
}
.selected-m .option-letter { background: var(--accent-mid); color: #fff; }

.correct-ans {
  border-color: var(--success);
  background: var(--success-bg);
  color: var(--success);
}
.correct-ans .option-letter { background: var(--success); color: #fff; }

.wrong-ans {
  border-color: var(--danger);
  background: var(--danger-bg);
  color: var(--danger);
}
.wrong-ans .option-letter { background: var(--danger); color: #fff; }

.missed-ans {
  border-color: var(--accent-mid);
  border-style: dashed;
  background: var(--accent-light);
  color: var(--accent-mid);
}

/* &#9472;&#9472; EXPLANATION &#9472;&#9472; */
.explanation {
  margin-top: 1.2rem;
  padding: 1rem 1.1rem;
  border-left: 3px solid var(--accent);
  background: var(--accent-light);
  font-size: 0.88rem;
  line-height: 1.65;
  display: none;
  color: var(--ink2);
  border-radius: 0 4px 4px 0;
}
.explanation.show { display: block; }
.explanation strong { color: var(--ink); font-weight: 600; }

/* &#9472;&#9472; SUBMIT / NEXT BUTTONS &#9472;&#9472; */
.btn {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  font-size: 0.88rem;
  font-weight: 600;
  padding: 0.8rem 1.8rem;
  cursor: pointer;
  border: 1.5px solid var(--border-strong);
  background: var(--surface);
  color: var(--ink2);
  border-radius: 5px;
  letter-spacing: 0.01em;
  transition: all 0.15s;
}
.btn:hover:not(:disabled) { border-color: var(--ink); color: var(--ink); background: var(--surface2); }
.btn.primary {
  background: var(--ink);
  color: #fff;
  border-color: var(--ink);
}
.btn.primary:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }

/* &#9472;&#9472; RESULTS &#9472;&#9472; */
.results-area { text-align: center; padding: 4rem 1rem; }
.results-card {
  display: inline-block;
  background: var(--surface);
  border: 2px solid var(--ink);
  border-radius: 8px;
  padding: 3rem 4rem;
  box-shadow: 4px 4px 0 var(--ink);
}
.final-score {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 5rem;
  font-weight: 400;
  color: var(--accent);
  line-height: 1;
  margin-bottom: 0.25rem;
}
.final-label {
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', 'Courier New', monospace;
  font-size: 0.75rem;
  color: var(--ink3);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 2rem;
}

/* &#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;
   MOBILE-FIRST RESPONSIVE FIXES
   &#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552; */

/* Header stacks cleanly on small screens */
@media (max-width: 600px) {

  /* Top bar - hide label, keep mode pill */
  .top-bar { padding: 0 1rem; }
  .top-bar-label { display: none; }

  /* Header becomes single column */
  header {
    padding: 1rem;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.8rem;
  }
  .header-title { font-size: 1.5rem; }
  .header-right {
    width: 100%;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  /* Tabs - smaller, allow wrap, no fixed widths */
  .version-tabs {
    flex-wrap: wrap;
    gap: 0.2rem;
    width: 100%;
  }
  .v-btn {
    padding: 0.35rem 0.6rem;
    font-size: 0.62rem;
    white-space: normal;
    flex: 1;
    text-align: center;
    min-width: 0;
  }

  /* Score badge - shrink, no min-width */
  .score-badge {
    min-width: 0;
    font-size: 0.7rem;
    padding: 0.3rem 0.6rem;
    white-space: nowrap;
  }

  /* Main padding */
  main { padding: 1.2rem 0.9rem; }

  /* Intro pickers */
  .pick-btn { min-width: 70px; padding: 0.7rem 0.4rem; }
  .pick-num { font-size: 1.3rem; }
  .pick-desc { font-size: 0.52rem; }
  .picker-grid { gap: 0.4rem; }

  /* Question card */
  .q-card { padding: 1.2rem 1rem 1rem; }
  .q-text { font-size: 1.05rem; margin-bottom: 1.1rem; }
  .q-meta { flex-direction: column; align-items: flex-start; gap: 0.35rem; }

  /* Option buttons - make tap targets big, wrap text properly */
  .option-btn {
    padding: 0.8rem 0.7rem;
    font-size: 0.88rem;
    align-items: flex-start;
    gap: 0.6rem;
    margin-bottom: 0.4rem;
  }
  .option-letter {
    width: 1.3rem;
    height: 1.3rem;
    font-size: 0.62rem;
    flex-shrink: 0;
    margin-top: 0.1rem;
  }

  /* Submit / Next buttons */
  .btn { font-size: 0.85rem; padding: 0.85rem 1.2rem; }
  .btn-start { font-size: 0.9rem; padding: 0.9rem 1.5rem; max-width: 100%; }

  /* Results */
  .results-card { padding: 2rem 1.5rem; }
  .final-score { font-size: 4rem; }

  /* Check items in combine-box */
  .check-item { font-size: 0.85rem; padding: 0.75rem 0.9rem; }
}

/* Intermediate breakpoint - tablets / narrow windows */
@media (max-width: 480px) {
  .v-btn { padding: 0.3rem 0.45rem; font-size: 0.58rem; }
  .header-title { font-size: 1.3rem; }
}

/* Utility classes replacing inline var() styles */
.bank-count {
  margin-left: auto;
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', 'Courier New', monospace;
  font-size: 0.7rem;
  color: #8a8480;
}
.multi-hint {
  font-size: 0.78rem;
  color: #8a8480;
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', 'Courier New', monospace;
  font-style: normal;
}
</style>
</head>
<body>

<div class="top-bar">
    <span class="top-bar-label">POLSC 120 &#183; Midterm 3</span>
    <span class="top-bar-mode mode-combined" id="top-bar-mode">Combined</span>
</div>

<header>
    <div class="header-left">
        <div class="header-title">Practice <em>Quiz</em></div>
        <div class="header-sub" id="header-sub">Combined Question Bank &#183; 167 Questions</div>
    </div>
    <div class="header-right">
        <div class="version-tabs">
            <button class="v-btn v0-btn active" id="btn-v0" onclick="switchVersion(0)">Combined</button>
            <button class="v-btn v7-btn" id="btn-v7" onclick="switchVersion(7)">Exam Prep</button>
            <button class="v-btn v6-btn" id="btn-v6" onclick="switchVersion(6)">M3 Bank</button>
            <button class="v-btn v8-btn" id="btn-v8" onclick="switchVersion(8)">Review</button>
        </div>
        <div class="score-badge" id="score-display">Score: &mdash; / &mdash;</div>
    </div>
</header>

<div class="progress-bar-wrap"><div class="progress-bar" id="progress-bar" style="width: 0%;"></div></div>

<main>
    <div id="intro">
        <div id="combine-box" class="combine-box">
            <div class="section-heading">Question Banks</div>
            <div class="check-item checked" id="chk-v7" onclick="toggleBank(this)">
                <span class="check-icon">&#10003;</span>
                <span>Exam Prep</span>
                <span class="bank-count">90Q</span>
            </div>
            <div class="check-item checked" id="chk-v6" onclick="toggleBank(this)">
                <span class="check-icon">&#10003;</span>
                <span>M3 Bank</span>
                <span class="bank-count">65Q</span>
            </div>
            <div class="check-item checked" id="chk-v8" onclick="toggleBank(this)">
                <span class="check-icon">&#10003;</span>
                <span>Review Lecture</span>
                <span class="bank-count">25Q</span>
            </div>
        </div>

        <div class="picker-section">
            <div class="section-heading">Difficulty</div>
            <div class="picker-grid">
                <button class="pick-btn active diff-btn" onclick="setDiff('all', this)"><span class="pick-num">All</span><span class="pick-desc">Mixed</span></button>
                <button class="pick-btn diff-btn" onclick="setDiff(1, this)"><span class="pick-num">1</span><span class="pick-desc">Foundational</span></button>
                <button class="pick-btn diff-btn" onclick="setDiff(2, this)"><span class="pick-num">2</span><span class="pick-desc">Standard</span></button>
                <button class="pick-btn diff-btn" onclick="setDiff(3, this)"><span class="pick-num">3</span><span class="pick-desc">Advanced</span></button>
            </div>
        </div>

        <div class="picker-section">
            <div class="section-heading">Question Count</div>
            <div id="length-ui"></div>
        </div>

<script>
/* &#9472;&#9472; V7 QUESTION BANK (Exam Prep &mdash; 90Q, multi-select) &#9472;&#9472; */
const v7Questions = [
  {section:"Unit 1: Federalism & Constitution",difficulty:1,q:"Which of the following are core features of the U.S. Constitution according to the course?",opts:["Federalism","Separation of powers","Checks and balances","Direct democracy","Patriotic reverence"],ans:[0, 1, 2, 4],exp:"The Constitution features <strong>federalism</strong>, <strong>separation of powers</strong>, <strong>checks and balances</strong>, and has inspired <strong>patriotic reverence</strong>. Direct democracy is NOT a feature."},
  {section:"Unit 1: Federalism & Constitution",difficulty:1,q:"According to the 'veto players' concept (Tsebelis 2003), which of the following serve as blocking mechanisms in the U.S.?",opts:["Three branches of government","The filibuster","Two chambers of Congress","Judicial review","Presidential veto and veto override"],ans:[0, 1, 2, 3, 4],exp:"ALL five are veto players: <strong>three branches</strong>, the <strong>filibuster</strong>, <strong>bicameralism</strong>, <strong>judicial review</strong>, and the <strong>veto/override</strong>."},
  {section:"Unit 1: Federalism & Constitution",difficulty:1,q:"George Will's 2010 quote argues which of the following about gridlock?",opts:["Gridlock is a failure of the American system","Gridlock is an achievement, not a problem","Madison designed government to be safe, not efficient","The Framers wanted blocking mechanisms","Gridlock benefits only the wealthy"],ans:[1, 2, 3],exp:"Will argued gridlock is an <strong>achievement</strong>; that <strong>Madison designed a safe &mdash; not efficient &mdash; government</strong>; and that the <strong>Framers deliberately built blocking mechanisms</strong>."},
  {section:"Unit 1: Federalism & Constitution",difficulty:1,q:"Elizabeth Warren's complicating claim about veto players argues:",opts:["Big-money players can overcome gridlock","Gridlock only stops legislation that helps ordinary citizens","Gridlock is beneficial for democracy","The blocking mechanisms serve elite interests","Both Will and Warren agree a lot of legislation gets stopped"],ans:[0, 1, 3, 4],exp:"Warren argues: <strong>big-money players CAN overcome gridlock</strong>; <strong>gridlock only stops legislation helping ordinary citizens</strong>; and <strong>blocking mechanisms serve elite interests</strong>."},
  {section:"Unit 1: Federalism & Constitution",difficulty:1,q:"Which of the following are formal methods of amending the U.S. Constitution?",opts:["A two-thirds vote in both houses of Congress","Presidential executive order","A two-thirds vote of state legislatures calling a convention","Ratification by three-fourths of states","Judicial interpretation by SCOTUS"],ans:[0, 2, 3],exp:"Formal amendment requires: <strong>2/3 vote in Congress</strong> OR <strong>2/3 of states calling a convention</strong>; then <strong>ratification by 3/4 of states</strong>."},
  {section:"Unit 1: Federalism & Constitution",difficulty:1,q:"Which of the following are 'informal' methods by which the Constitution changes?",opts:["Judges change their interpretation","New social developments prompt new judicial precedents","Constitutional conventions","Technological change forces constitutional rethinking","Two-thirds congressional vote"],ans:[0, 1, 3],exp:"Informal change occurs through <strong>judicial interpretation</strong>, <strong>social developments</strong>, and <strong>technological change</strong>."},
  {section:"Unit 1: Federalism & Constitution",difficulty:1,q:"Which powers are reserved exclusively to the states under the Constitution?",opts:["Coin money","Public health and safety legislation","Establish local governments","Declare war","State criminal law"],ans:[1, 2, 4],exp:"Reserved state powers include <strong>health/safety</strong>, <strong>local governments</strong>, and <strong>state criminal law</strong>."},
  {section:"Unit 1: Federalism & Constitution",difficulty:1,q:"Which of the following are concurrent powers shared by both the national and state governments?",opts:["Taxation","Borrow money","Declare war","Establish courts","Coin money"],ans:[0, 1, 3],exp:"Concurrent powers include <strong>taxation</strong>, <strong>borrowing money</strong>, and <strong>establishing courts</strong>."},
  {section:"Unit 1: Federalism & Constitution",difficulty:1,q:"According to the Supremacy Clause (Article VI), which of the following are the 'supreme law of the land'?",opts:["U.S. Constitution","Federal laws","Treaties","State constitutions","Executive agreements"],ans:[0, 1, 2],exp:"The Clause names: <strong>U.S. Constitution</strong>, <strong>federal laws</strong>, and <strong>treaties</strong>."},
  {section:"Unit 2: Congress",difficulty:1,q:"The U.S. Senate's equal representation (2 senators per state) has which of the following characteristics?",opts:["It is exempt from constitutional amendment","It means the 26 least-populous states elect 52 senators","It makes the U.S. the world's most geographically distorting upper chamber","It was established in Article II of the Constitution","The ratio of best-represented to worst-represented states is 66:1"],ans:[0, 1, 2, 4],exp:"Senate representation is <strong>exempt from amendment</strong>; <strong>26 small states elect 52 senators</strong>; and the <strong>66:1 ratio</strong> is globally unique."},
  {section:"Unit 2: Congress",difficulty:1,q:"Which of the following are features of the U.S. House of Representatives?",opts:["435 voting members apportioned by population","Two-year terms","Initiates all revenue bills","Approves treaties","Tries impeached officials"],ans:[0, 1, 2],exp:"The House has <strong>435 members</strong>, <strong>2-year terms</strong>, and <strong>initiates revenue bills</strong>."},
  {section:"Unit 2: Congress",difficulty:1,q:"Which of the following are exclusive powers of the U.S. Senate?",opts:["Advice and consent on presidential appointments","Initiate revenue bills","Try impeached officials","Approve treaties by two-thirds vote","Initiate impeachment"],ans:[0, 2, 3],exp:"Senate-only: <strong>Advice and consent</strong>, <strong>trying impeached officials</strong>, and <strong>approving treaties (2/3)</strong>."},
  {section:"Unit 2: Congress",difficulty:2,q:"Which of the following are listed as advantages of incumbency (Table 6.4)?",opts:["Name recognition","Franking privilege","Casework","Unlimited campaign finance","Redistricting to enhance electability"],ans:[0, 1, 2, 4],exp:"Advantages: <strong>name recognition</strong>, <strong>franking</strong> (free mail), <strong>casework</strong>, and <strong>redistricting</strong>."},
  {section:"Unit 2: Congress",difficulty:2,q:"The filibuster in the Senate is best described by which of the following?",opts:["A mechanism to halt Senate action through unlimited debate","It effectively requires 60 votes to bring a bill to a final vote","Ended by a cloture motion requiring 60 senators' signatures","It can be used to block Supreme Court nominations since 2017","It represents a major veto point in the legislative process"],ans:[0, 1, 2, 4],exp:"Filibuster requires <strong>60 votes for cloture</strong> and is a <strong>major veto point</strong>. Not allowed for SCOTUS since 2017."},
  {section:"Unit 2: Congress",difficulty:1,q:"Under the Law-Making Function (6.5), which steps must a bill pass through?",opts:["Committee referral and markup","Floor debate","Conference committee if House and Senate versions differ","Presidential signing or veto","Supreme Court review"],ans:[0, 1, 2, 3],exp:"Standard steps: <strong>Committee markup</strong>, <strong>Floor debate</strong>, <strong>Conference committee</strong>, and <strong>Presidential action</strong>."},
  {section:"Unit 2: Congress",difficulty:2,q:"The War Powers Resolution (1973) requires which of the following?",opts:["Presidential notification of Congress within 48 hours of troop deployment","Withdrawal within 60 days unless Congress declares war","Senate ratification of military treaties","Prior consultation with Congress when possible","All presidents since Nixon have recognized its constitutionality"],ans:[0, 1, 3],exp:"Requires <strong>48-hour notification</strong>, <strong>60-day withdrawal</strong>, and <strong>prior consultation</strong>."},
  {section:"Unit 2: Congress",difficulty:1,q:"Which of the following are political actors that influence how members of Congress vote (6.6)?",opts:["Political parties","Constituents","Interest groups and lobbyists","Staff and support agencies","The Supreme Court's most recent rulings"],ans:[0, 1, 2, 3],exp:"Influences include <strong>parties</strong>, <strong>constituents</strong>, <strong>interest groups</strong>, and <strong>support staff</strong>."},
  {section:"Unit 2: Congress",difficulty:2,q:"Baker v. Carr (1962) established which of the following?",opts:["Redistricting is a justiciable question that courts can rule on","Districts may be apportioned by population","Purposeful gerrymandering to dilute votes of people of color is illegal","The Supreme Court has no role in redistricting","State legislatures must use nonpartisan commissions"],ans:[0, 1, 2],exp:"Established redistricting as <strong>justiciable</strong> and protected against minority <strong>vote dilution</strong>."},
  {section:"Unit 2: Congress",difficulty:2,q:"Gerrymandering is best described by which of the following?",opts:["Drawing district lines to produce a specific electoral outcome","Named for Governor Elbridge Gerry and the shape of a salamander","Always ruled unconstitutional by the Supreme Court","Can be used to enhance or dilute the votes of communities of color","Driven by population growth, partisan goals, and Voting Rights Act requirements"],ans:[0, 1, 3, 4],exp:"Gerrymandering is <strong>drawing lines for outcomes</strong>, named for <strong>Elbridge Gerry</strong>, and affects minority votes."},
  {section:"Unit 2: Congress",difficulty:2,q:"The Congressional Budget Office (CBO) was created in 1974 and serves which functions?",opts:["Evaluates the economic effect of different spending programs","Provides information on the cost of proposed policies","Analyzes the president's budget and economic projections","Provides a nonpartisan 'second opinion' in budget debates","Audits executive branch financial expenditures"],ans:[0, 1, 2, 3],exp:"CBO provides <strong>nonpartisan cost analysis</strong> and <strong>budget evaluations</strong>. Audit is GAO's job."},
  {section:"Unit 3: Presidency & Executive Branch",difficulty:1,q:"Which of the following are formal constitutional powers of the President (7.2)?",opts:["Appointment power (with Senate advice and consent)","Veto proposals from Congress","Pardon criminals and suspects","Declare war unilaterally","Negotiate international treaties"],ans:[0, 1, 2, 4],exp:"Formal powers: <strong>Appointments</strong>, <strong>Veto</strong>, <strong>Pardons</strong>, and <strong>Treaties</strong>. Only Congress declares war."},
  {section:"Unit 3: Presidency & Executive Branch",difficulty:2,q:"Which of the following are accurate regarding the presidential veto power?",opts:["Congress can override a veto with a two-thirds vote in each chamber","The president can veto constitutional amendments","A veto threat alone can force Congress to modify legislation","Biden issued zero vetoes in the first half of his term","Vetoes are rare when Congress and president share the same party"],ans:[0, 2, 3, 4],exp:"Veto: <strong>2/3 override</strong>, <strong>veto threats</strong> influence law, and <strong>rare in unified govt</strong>."},
  {section:"Unit 3: Presidency & Executive Branch",difficulty:2,q:"Which of the following are true about executive agreements (vs. formal treaties)?",opts:["They do not require Senate approval","They are not binding on future administrations","They have been used since the Washington administration","Courts have approved their use","They require a two-thirds Senate vote"],ans:[0, 1, 2, 3],exp:"Agreements <strong>don't require Senate approval</strong> and <strong>aren't binding</strong> on successors."},
  {section:"Unit 3: Presidency & Executive Branch",difficulty:1,q:"FDR's legacy to future presidents included which of the following (7.3)?",opts:["A burgeoning federal bureaucracy","An active presidential role in domestic and foreign policy","A nationalized executive office using technology to connect with the public","The tradition of two-term limits now codified in the 22nd Amendment","The elimination of the separation of powers doctrine"],ans:[0, 1, 2],exp:"FDR left a <strong>big bureaucracy</strong>, an <strong>active leadership role</strong>, and <strong>nationalized the office</strong>."},
  {section:"Unit 3: Presidency & Executive Branch",difficulty:2,q:"Executive orders have which of the following characteristics?",opts:["They have the force of law within the executive branch","They do not require congressional approval","They can be retracted by future presidents","They are explicitly authorized by Article II of the Constitution","Truman used one to end military segregation"],ans:[0, 1, 2, 4],exp:"Orders have <strong>force of law</strong>, no Congress approval, and are <strong>retractable</strong>."},
  {section:"Unit 3: Presidency & Executive Branch",difficulty:3,q:"Lincoln justified his unprecedented wartime actions as:",opts:["Inherent presidential powers necessary to preserve the Union","His duty to 'faithfully execute' the laws even when circumventing the Constitution","Explicit grants of power in Article II","Congressional authorizations passed in advance","The precedent set by Washington's use of inherent powers"],ans:[0, 1, 4],exp:"Lincoln cited <strong>inherent powers</strong>, <strong>faithful execution</strong>, and <strong>Washington's precedent</strong>."},
  {section:"Unit 3: Presidency & Executive Branch",difficulty:2,q:"The Miller reading ('Immune, Immune, Immune') covers which of the following?",opts:["The Supreme Court ruled 6-3 that former presidents are shielded for 'official acts'","Immunity IS explicitly stated in the Constitution","Sotomayor dissented, warning of 'disastrous consequences for democracy'","The majority based its reasoning on the 'chilling effect' argument","Barrett agreed on immunity but objected to one clause of the ruling"],ans:[0, 2, 3, 4],exp:"Ruling <strong>granted immunity for official acts</strong> (6-3). Immunity is NOT explicit in the text."},
  {section:"Unit 3: Presidency & Executive Branch",difficulty:1,q:"The four categories of federal agencies are:",opts:["Cabinet departments","Independent executive agencies","Independent regulatory commissions","Government corporations","State regulatory agencies"],ans:[0, 1, 2, 3],exp:"Categories: <strong>Cabinet</strong>, <strong>Independent Executive</strong>, <strong>Regulatory Commissions</strong>, and <strong>Government Corporations</strong>."},
  {section:"Unit 3: Presidency & Executive Branch",difficulty:2,q:"Independent regulatory commissions have which of the following characteristics?",opts:["Created by Congress to regulate a specific economic activity","5-7 members with fixed, staggered terms","President cannot easily remove members","Examples include SEC, FCC, NLRB, and the Federal Reserve","Their heads serve at the pleasure of the president"],ans:[0, 1, 2, 3],exp:"Commissioners have <strong>fixed terms</strong> and <strong>protection from removal</strong>."},
  {section:"Unit 3: Presidency & Executive Branch",difficulty:1,q:"The Hatch Act (1939) and its amendments allow federal employees to do which of the following?",opts:["Run for office in nonpartisan elections","Donate to political organizations","Campaign for candidates while off-duty","Engage in political activity while on duty","Solicit contributions from the general public"],ans:[0, 1, 2],exp:"Allows <strong>off-duty campaigning</strong> and <strong>nonpartisan runs</strong>."},
  {section:"Unit 3: Presidency & Executive Branch",difficulty:2,q:"Max Weber's model bureaucracy includes which of the following features?",opts:["A chain of command with authority flowing top to bottom","Division of labor among specialized workers","Impersonality &mdash; employees treated by merit, clients served equally","Goal orientation determining structure, authority, and rules","Democratic elections for all leadership positions"],ans:[0, 1, 2, 3],exp:"Weber: <strong>Chain of command</strong>, <strong>specialization</strong>, and <strong>merit-based service</strong>."},
  {section:"Unit 3: Presidency & Executive Branch",difficulty:1,q:"An iron triangle consists of which three actors?",opts:["Federal agency workers","Interest groups","The president and Cabinet","Relevant congressional committees/subcommittees","State governments"],ans:[0, 1, 3],exp:"Components: <strong>Agency</strong>, <strong>Interest Group</strong>, and <strong>Congressional Committee</strong>."},
  {section:"Unit 3: Presidency & Executive Branch",difficulty:2,q:"Issue networks differ from iron triangles in which of the following ways?",opts:["They are broader and include lawyers, consultants, academics, and PR specialists","They constantly change as new parties with expertise get involved","They are more stable and closed than iron triangles","They sometimes include courts","They are sometimes called 'policy coordinating committees'"],ans:[0, 1, 3],exp:"Issue networks are <strong>broader</strong>, <strong>more fluid</strong>, and <strong>include experts/courts</strong>."},
  {section:"Unit 3: Presidency & Executive Branch",difficulty:2,q:"Rule making by federal agencies involves which of the following steps?",opts:["Publishing notice of proposed rule in the Federal Register","A 30-60 day public comment period","OMB review of objectives and costs","A vote in Congress to approve the rule","Final publication of the rule in the Federal Register"],ans:[0, 1, 2, 4],exp:"Steps: <strong>Notice</strong>, <strong>Comment period</strong>, <strong>OMB review</strong>, and <strong>Final Publication</strong>."},
  {section:"Unit 3: Presidency & Executive Branch",difficulty:1,q:"The EPA was created with which of the following characteristics?",opts:["Created in 1970 by President Nixon","An independent executive agency (not placed under Interior)","Enforces the Clean Air Act (1970) and Clean Water Act (1972)","Created by the Clinton administration","Air pollution in the U.S. dropped by one-third to one-half between 1970-1990"],ans:[0, 1, 2, 4],exp:"Created <strong>1970 by Nixon</strong>; independent; enforces <strong>Clean Air/Water Acts</strong>."},
  {section:"Unit 4: Judiciary",difficulty:1,q:"Marbury v. Madison (1803) established which of the following?",opts:["The power of judicial review","Courts can strike down acts of Congress that violate the Constitution","The Court is the final arbiter of constitutional questions","Judicial review is explicitly stated in Article III","The Marshall Court established the Court as a co-equal branch"],ans:[0, 1, 2, 4],exp:"Established <strong>judicial review</strong>. It is NOT explicit in the Constitution."},
  {section:"Unit 4: Judiciary",difficulty:2,q:"Bowie's historical evidence includes which of the following examples of SCOTUS acting antidemocratically?",opts:["Striking down six Reconstruction-era laws protecting voting rights","Shelby County v. Holder gutting the Voting Rights Act","Citizens United overturning campaign finance laws","Brown v. Board of Education establishing school desegregation","Pollock v. Farmers' Loan striking down the federal income tax"],ans:[0, 1, 2, 4],exp:"Examples: <strong>gutting voting rights</strong>, <strong>Citizens United</strong>, and <strong>Pollock</strong>."},
  {section:"Unit 4: Judiciary",difficulty:3,q:"Bowie argues that Brown v. Board of Education worked because:",opts:["The Court enforced the Ku Klux Klan Act of 1871 (a federal law) against recalcitrant states","It was an example of the Court overruling Congress","Real desegregation only came after the Civil Rights Act and VRA (1964-65)","It showed judicial review at its most democratic","The Court was acting as an agent of Congress's democratic will"],ans:[0, 2, 4],exp:"Worked because it <strong>enforced federal law</strong> and <strong>CRA/VRA delivered</strong>."},
  {section:"Unit 4: Judiciary",difficulty:3,q:"According to Bowie, the 'countermajoritarian difficulty' is demonstrated by which of the following?",opts:["When the Court invalidates a law, 5 justices override the president + 500+ Congress members","To overrule the Court via amendment requires 2/3 of both houses + 3/4 of states","Overturning a Court decision is nearly impossible","The Court has historically protected the poor and marginalized","Wealthy litigants have resources to repeatedly challenge laws in court"],ans:[0, 1, 2, 4],exp:"Difficulty: <strong>5 override all</strong>; <strong>amendments are nearly impossible</strong>."},
  {section:"Unit 4: Judiciary",difficulty:1,q:"The federal court hierarchy from lowest to highest is:",opts:["U.S. District Courts &rarr; U.S. Courts of Appeals &rarr; U.S. Supreme Court","U.S. Courts of Appeals &rarr; U.S. District Courts &rarr; U.S. Supreme Court","State Trial Courts are part of the federal hierarchy","The Supreme Court handles 97-99% of cases under appellate jurisdiction","There are 94 U.S. District Courts and 13 Courts of Appeals"],ans:[0, 3, 4],exp:"Hierarchy: <strong>District -> Circuit (Appeals) -> SCOTUS</strong>."},
  {section:"Unit 1: Federalism & Constitution",difficulty:2,q:"Which of the following connect the veto players concept to specific institutions?",opts:["The Senate filibuster is a veto point","The president's veto is a veto play","The Supreme Court's judicial review is a veto mechanism","Congressional committee referral where bills can die is a veto gate","The Electoral College only applies to domestic legislation"],ans:[0, 1, 2, 3],exp:"Includes <strong>filibuster</strong>, <strong>veto</strong>, <strong>judicial review</strong>, and <strong>committees</strong>."},
  {section:"Unit 3: Presidency & Executive Branch",difficulty:2,q:"In the iron triangle diagram (Figure 8.6), which relationships are accurately described?",opts:["Interest groups provide electoral support to Congress","Congress provides funding and political support to bureaucracy","Bureaucracy gives low regulations and special favors to interest groups","The White House directly controls all three corners of the triangle","Congress provides friendly oversight and legislation to interest groups"],ans:[0, 1, 2, 4],exp:"Relationships: <strong>IG gives support to Congress</strong>, <strong>Congress funds Agency</strong>."},
  {section:"Unit 3: Presidency & Executive Branch",difficulty:2,q:"Which of the following statements about the modern presidency are accurate?",opts:["Presidents today typically propose legislation and submit budgets","FDR broke the model that lawmaking was solely Congress's responsibility","The Office of Management and Budget prepares the annual budget proposal","The modern presidency began with George Washington","LBJ noted that legislative speed depends on 'constant attention from the administration'"],ans:[0, 1, 2, 4],exp:"Modern POTUS (post-FDR) <strong>proposes budgets</strong> and <strong>leads lawmaking</strong>."},
  {section:"Unit 3: Presidency & Executive Branch",difficulty:2,q:"The 'revolving door' phenomenon in bureaucracy refers to:",opts:["Decision makers in the executive branch ending up working for industries they previously regulated","The movement of members of Congress to and from lobbying jobs","A key mechanism of regulatory capture","A formal process established by the Administrative Procedures Act","Something the course will address more fully in later units on political money and lobbying"],ans:[0, 1, 2, 4],exp:"Movement of <strong>officials to regulated industries</strong>; causes <strong>capture</strong>."},
  {section:"Unit 3: Presidency & Executive Branch",difficulty:2,q:"Which of the following are true about the relationship between the president and Congress on war powers?",opts:["Only Congress can formally declare war","Presidents have frequently deployed troops without a formal declaration of war","The War Powers Resolution has been recognized as constitutional by all presidents","The War Powers Resolution requires withdrawal within 60 days without congressional approval","Nixon vetoed the War Powers Resolution but Congress overrode it"],ans:[0, 1, 3, 4],exp:"Only <strong>Congress declares war</strong>; POTUS <strong>must withdraw troops</strong> in 60 days."},
  {section:"Unit 4: Judiciary",difficulty:3,q:"The following connect the Bowie reading to the broader course themes:",opts:["SCOTUS justices are near-totally Harvard and Yale graduates &mdash; a 'judicial aristocracy'","Bowie argues Congress, not courts, should have the final say on constitutional interpretation","The primary 'minority' protected by judicial review is the wealthy class (according to Bowie)","Bowie is more accepting of SCOTUS acting as national enforcer against states","Bowie argues judicial review of STATE laws is equally problematic as review of federal laws"],ans:[0, 1, 2, 3],exp:"Bowie: <strong>Judicial Aristocracy</strong>; protects the <strong>wealthy</strong>; <strong>Congress</strong> should decide."},
  {section:"Unit 2: Congress",difficulty:2,q:"Which of the following best describe the politics of redistricting?",opts:["It is largely a political process in most states","Partisan state legislatures draw district lines to protect their majority","Gerrymandering can dilute or enhance the votes of communities of color","The Supreme Court has ruled partisan gerrymandering is always unconstitutional","Some states (Iowa, Arizona) use nonpartisan commissions to draw lines"],ans:[0, 1, 2, 4],exp:"Redistricting is <strong>highly political</strong>; some states use <strong>commissions</strong>."},
  {section:"Unit 3: Presidency & Executive Branch",difficulty:2,q:"Which of the following are true about independent regulatory commissioners?",opts:["Each president can appoint up to ~100 commissioners","They become independent of the president's direct political influence once in office","The president can fire them at will","Their terms are fixed and staggered to ensure bipartisan composition","A 1935 Supreme Court ruling affirmed their independence from political pressures"],ans:[0, 1, 3, 4],exp:"Once in office, they are <strong>independent</strong> and <strong>protected from removal</strong>."},
  {section:"Unit 3: Presidency & Executive Branch",difficulty:1,q:"The Administrative Procedures Act (1946) established which of the following?",opts:["A specific process for agency rule making","Public notice of proceedings must be published in the Federal Register","Interested parties may submit written arguments and facts","Rules take effect immediately upon drafting","At least 30 days must elapse after publication before rules take effect"],ans:[0, 1, 2, 4],exp:"Established <strong>formal rulemaking</strong> and the <strong>30-day wait</strong> period."},
  {section:"Unit 3: Presidency & Executive Branch",difficulty:2,q:"Which of the following are accurate about presidential appointments?",opts:["The president can make nearly 3,500 appointments to the administration","About 1,125 appointments require Senate confirmation","The president can remove most appointees at will","Presidential influence through judicial appointments can outlast the president's time in office","The president can remove federal judges at will"],ans:[0, 1, 2, 3],exp:"POTUS can remove <strong>most appointees</strong> at will, but <strong>not federal judges</strong>."},
  {section:"Unit 1: Federalism & Constitution",difficulty:2,q:"The Schoolhouse Rock video's treatment of the Constitution is criticized for:",opts:["It oversimplifies and 'idealizes' checks and balances","It presents gridlock as entirely positive","It serves as an example of patriotic reverence toward the Constitution","It accurately depicts how veto players function","It emphasizes the role of political parties"],ans:[0, 1, 2],exp:"Criticized for <strong>oversimplifying</strong> and <strong>patriotic reverence</strong>."},
  {section:"Unit 2: Congress",difficulty:2,q:"The Senate's equal representation rule has which of the following implications?",opts:["It is 'exempt from constitutional amendment' per Chemerinsky","It gives equal weight to all Americans regardless of where they live","Small-state senators hold disproportionate power","This is why large states like California wouldn't want to split into multiple states","This distortion is unique globally &mdash; no other federal democracy comes close to 66:1"],ans:[0, 2, 3, 4],exp:"Exempt from <strong>amendment</strong>; gives <strong>small states power</strong>."},
  {section:"Unit 3: Presidency & Executive Branch",difficulty:1,q:"Which correctly describe the pardoning power?",opts:["Complete pardoning power for federal offenses","Includes power to pardon in cases of impeachment","May issue commutations","Can grant general amnesties","Biden pardoned convictions for simple marijuana possession"],ans:[0, 2, 3, 4],exp:"Complete for <strong>federal offenses</strong>; NO pardons for <strong>impeachment</strong>."},
  {section:"Unit 3: Presidency & Executive Branch",difficulty:2,q:"The Truman quote about Eisenhower ('Poor Ike &mdash; nothing will happen') illustrates:",opts:["The limits of presidential power despite formal authority","That most presidents find goals harder than anticipated","The gap between formal and informal powers","That Congress has all the power","The importance of military experience"],ans:[0, 1, 2],exp:"Illustrates the <strong>limits</strong> and <strong>gap between formal/informal power</strong>."},
  {section:"Unit 3: Presidency & Executive Branch",difficulty:2,q:"Which correctly describe the federal budget process?",opts:["The OMB prepares the annual budget proposal","The Congressional Budget Act of 1974 created the CBO","The federal fiscal year runs from October 1 to September 30","The budget process schedule is strictly followed each year","Reconciliation limits Senate debate to 20 hours"],ans:[0, 1, 2, 4],exp:"<strong>OMB prepares</strong>; <strong>CBO created 1974</strong>; <strong>Reconciliation</strong> bypasses filibuster."},
  {section:"Unit 3: Presidency & Executive Branch",difficulty:2,q:"An 'executive agreement' differs from a treaty in which ways?",opts:["Does not require Senate approval","Is not binding on future administrations","Has been used since the Washington administration","Is explicitly authorized in Article II","Trump withdrew from the JCPOA using this mechanism"],ans:[0, 1, 2, 4],exp:"<strong>No Senate approval</strong>; <strong>non-binding</strong>. Not explicit in Article II."},
  {section:"Unit 3: Presidency & Executive Branch",difficulty:2,q:"The course describes 'signing statements' as:",opts:["Written comments attached to a bill when signed into law","May signal intent to ignore provisions deemed unconstitutional","George W. Bush used on more than 1,200 laws","Their legal force remains unclear","Always legally binding on executive agencies"],ans:[0, 1, 2, 3],exp:"Comments attached at <strong>signing</strong>; legal force is <strong>unclear</strong>."},
  {section:"Unit 2: Congress",difficulty:2,q:"Which are true about congressional oversight?",opts:["Committee hearings are the primary tool","Congress can issue subpoenas","Hearings are visible during divided government","Oversight can include impeachment","The CBO conducts financial audits"],ans:[0, 1, 2, 3],exp:"Primary tool is <strong>hearings</strong>; includes <strong>subpoenas</strong> and <strong>impeachment</strong>."},
  {section:"Unit 3: Presidency & Executive Branch",difficulty:1,q:"Government corporations have which of the following characteristics?",opts:["Established by Congress for functions private businesses won't provide","Examples include USPS and Amtrak","They charge a fee for services","They are always more efficient","The USPS is a massive employer"],ans:[0, 1, 2, 4],exp:"<strong>USPS/Amtrak</strong>; they <strong>charge fees</strong> for services."},

let questions = []; 
let score = 0, answered = 0;
let selectedDifficulty = 'all';
let selectedLength = 50;
let activeVersion = 0;

const config = {
    0: { cls: "v0", lab: "Combined Bank", getPool: () => [...v7Questions, ...v6Questions, ...v8Questions], lens: [20, 75, 205] },
    7: { cls: "v7", lab: "Exam Prep (90Q)", getPool: () => v7Questions, lens: [20, 45, 90] },
    6: { cls: "v6", lab: "M3 Bank (65Q)", getPool: () => v6Questions, lens: [20, 40, 65] },
    8: { cls: "v8", lab: "Review Lecture (25Q)", getPool: () => v8Questions, lens: [10, 15, 25] }
};

function switchVersion(v) {
    activeVersion = v;
    const cfg = config[v];
    
    document.getElementById('intro').style.display = 'block';
    document.getElementById('quiz-area').style.display = 'none';
    document.getElementById('results').style.display = 'none';
    document.getElementById('score-display').innerText = "Score: — / —";
    document.getElementById('progress-bar').style.width = "0%";
    score = 0; answered = 0;

    const modeMap = {0:'mode-combined',7:'mode-exam',6:'mode-m3',8:'mode-review'};
    const modeLabel = {0:'Combined',7:'Exam Prep',6:'M3 Bank',8:'Review'};
    const el = document.getElementById('top-bar-mode');
    el.className = 'top-bar-mode ' + (modeMap[v]||'mode-combined');
    el.innerText = modeLabel[v]||'Combined';
    document.getElementById('header-sub').innerText = cfg.lab;
    
    document.querySelectorAll('.v-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-v'+v).classList.add('active');

    document.getElementById('combine-box').style.display = (v === 0) ? 'block' : 'none';

    const lUI = document.getElementById('length-ui');
    if (v === 0) {
        lUI.innerHTML = `<div class="slider-wrap"><input type="range" class="q-slider" min="10" max="167" value="50" oninput="selectedLength=parseInt(this.value); document.getElementById('sl').innerText=this.value"><div class="slider-readout"><span id="sl">50</span> Questions</div></div>`;
        selectedLength = 50;
    } else {
        lUI.innerHTML = `<div class="picker-grid" id="l-grid"></div>`;
        cfg.lens.forEach((l, i) => {
            const b = document.createElement('button');
            b.className = "pick-btn len-btn" + (i === 2 ? " active" : "");
            b.onclick = () => {
                selectedLength = l;
                document.querySelectorAll('.len-btn').forEach(el => el.classList.remove('active'));
                b.classList.add('active');
            };
            const desc = ["Quick", "Standard", "Full Bank"][i];
            b.innerHTML = `<span class="pick-num">${l}</span><span class="pick-desc">${desc}</span>`;
            document.getElementById('l-grid').appendChild(b);
        });
        selectedLength = cfg.lens[2];
    }
}

function setDiff(d, btn) {
    selectedDifficulty = d;
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
}

function startQuiz() {
    let pool = [];
    if (activeVersion === 0) {
        if (document.getElementById('chk-v7').classList.contains('checked')) pool.push(...v7Questions);
        if (document.getElementById('chk-v6').classList.contains('checked')) pool.push(...v6Questions);
        if (document.getElementById('chk-v8').classList.contains('checked')) pool.push(...v8Questions);
    } else {
        pool = config[activeVersion].getPool();
    }

    if (selectedDifficulty !== 'all') {
        pool = pool.filter(q => q.difficulty == selectedDifficulty);
    }

    questions = pool.sort(() => Math.random() - 0.5).slice(0, selectedLength);
    
    if (questions.length === 0) {
        alert("No questions found for this difficulty in the selected bank.");
        return;
    }

    document.getElementById('intro').style.display = 'none';
    document.getElementById('quiz-area').style.display = 'block';
    renderQuestion(0);
}

function shuffleOpts(q) {
    // Returns {opts, ans} with options shuffled and answer index/indices remapped
    const indices = q.opts.map((_, i) => i);
    for (let i = indices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indices[i], indices[j]] = [indices[j], indices[i]];
    }
    const newOpts = indices.map(i => q.opts[i]);
    const isMulti = Array.isArray(q.ans);
    const newAns = isMulti
        ? q.ans.map(a => indices.indexOf(a))
        : indices.indexOf(q.ans);
    return { opts: newOpts, ans: newAns };
}

function renderQuestion(idx) {
    const q = questions[idx];
    const shuffled = shuffleOpts(q);
    q._opts = shuffled.opts;
    q._ans  = shuffled.ans;
    const area = document.getElementById('quiz-area');
    const isMulti = Array.isArray(q.ans);
    
    const letters = ['A','B','C','D','E','F'];
    area.innerHTML = `
        <div class="q-card">
            <div class="q-meta">
                <span class="q-num-label">Question ${idx + 1} of ${questions.length}</span>
                <span class="section-tag">${q.section}</span>
            </div>
            <div class="q-text">${q.q}</div>
            <div id="opts">
                ${q._opts.map((o, i) => `<button class="option-btn" id="o-${i}" onclick="${isMulti ? `toggleM(${i})` : `selectS(${idx}, ${i})`}"><span class="option-letter">${letters[i]}</span><span>${isMulti ? '' : ''}${o}</span></button>`).join('')}
            </div>
            ${isMulti ? `<div style="margin-top:0.5rem"><em class="multi-hint">Select all that apply</em></div><button class="btn primary" id="sub-m" style="margin-top:0.8rem; width:100%;" onclick="submitM(${idx})" disabled>Submit Answer</button>` : ''}
            <div class="explanation" id="exp-${idx}">${q.exp}</div>
            <button class="btn primary" id="next-btn" style="display:none; margin-top:1.2rem; width:100%" onclick="nextQ(${idx})">${idx === questions.length - 1 ? 'Finish & See Results' : 'Next Question &rarr;'}</button>
        </div>
    `;
    document.getElementById('progress-bar').style.width = (answered / questions.length * 100) + "%";
}

function selectS(qIdx, i) {
    const q = questions[qIdx];
    const isCorrect = i === q._ans;
    if (isCorrect) score++;
    answered++;
    
    document.getElementById('o-'+i).classList.add(isCorrect ? 'correct-ans' : 'wrong-ans');
    document.getElementById('o-'+q._ans).classList.add('correct-ans');
    document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
    document.getElementById('exp-'+qIdx).classList.add('show');
    document.getElementById('next-btn').style.display = 'block';
    document.getElementById('score-display').innerText = `${score} / ${answered} correct`;
}

function toggleM(i) {
    const btn = document.getElementById('o-'+i);
    btn.classList.toggle('selected-m');
    const hasSelection = document.querySelectorAll('.selected-m').length > 0;
    document.getElementById('sub-m').disabled = !hasSelection;
}

function submitM(qIdx) {
    const q = questions[qIdx];
    const userSels = Array.from(document.querySelectorAll('.selected-m')).map(b => parseInt(b.id.split('-')[1]));
    const correctSet = new Set(q._ans);
    
    const isCorrect = userSels.length === q._ans.length && userSels.every(v => correctSet.has(v));
    
    if (isCorrect) score++;
    answered++;

    q._opts.forEach((_, i) => {
        const btn = document.getElementById('o-'+i);
        btn.disabled = true;
        const wasSelected = userSels.includes(i);
        const isAnswer = correctSet.has(i);
        btn.classList.remove('selected-m');
        
        if (isAnswer && wasSelected) btn.classList.add('correct-ans');
        else if (!isAnswer && wasSelected) btn.classList.add('wrong-ans');
        else if (isAnswer && !wasSelected) btn.classList.add('missed-ans');
    });

    document.getElementById('exp-'+qIdx).classList.add('show');
    document.getElementById('next-btn').style.display = 'block';
    document.getElementById('score-display').innerText = `${score} / ${answered} correct`;
}

function nextQ(idx) {
    if (idx + 1 < questions.length) {
        renderQuestion(idx + 1);
    } else {
        document.getElementById('quiz-area').style.display = 'none';
        document.getElementById('results').style.display = 'block';
        const finalPct = Math.round((score/questions.length)*100);
        document.getElementById('results').innerHTML = `
            <div class="results-area">
                <div class="results-card">
                    <div class="final-score">${finalPct}%</div>
                    <div class="final-label">${score} correct of ${questions.length} questions</div>
                    <button class="btn primary" onclick="switchVersion(activeVersion)">Try Another Round</button>
                </div>
            </div>
        `;
    }
}

function toggleBank(el) {
    el.classList.toggle('checked');
    const icon = el.querySelector('.check-icon');
    if (icon) icon.innerText = el.classList.contains('checked') ? '&#10003;' : '';
}

switchVersion(0);
</script>
