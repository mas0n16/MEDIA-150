<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Illustrator Eye</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .montage-container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            border: 2px solid #000;
            border-radius: 8px;
            background-color: #44b1cccc;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }
        .montage-main img {
            width: 750px;
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div id="sidebar-container"></div>
    <script>
        fetch('sidebar.html')
            .then(res => res.text())
            .then(html => {
                const container = document.getElementById('sidebar-container');
                container.innerHTML = html;
                container.querySelectorAll('script').forEach(oldScript => {
                    const newScript = document.createElement('script');
                    newScript.textContent = oldScript.textContent;
                    document.body.appendChild(newScript);
                });
            });
    </script>

    <header style="text-align: center;"><b>My Eye (work in progress)</b></header>
    <br>

    <div class="montage-container">
        <div class="montage-main">
            <img src="media/mason-eye.png" alt="Eye Illustrator">
        </div>
    </div>

</body>
</html>
