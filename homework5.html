<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Illustrator Eye</title>
    <style>
body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    line-height: 1.6;
    margin: 20px;
    background-color: #8bcff0;
}
.menu-toggle {
    position: fixed;
    top: 18px;
    left: 20px;
    z-index: 1000;
    background: #0099cc;
    border: none;
    border-radius: 6px;
    width: 44px;
    height: 44px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
}
.menu-toggle span {
    display: block;
    width: 22px;
    height: 2.5px;
    background: #fff;
    border-radius: 2px;
    transition: transform 0.3s, opacity 0.3s;
}
.sidebar {
    position: fixed;
    top: 0;
    left: -270px;
    z-index: 999;
    width: 260px;
    height: 100%;
    background: #1a6e8e;
    box-shadow: 4px 0 18px rgba(0,0,0,0.25);
    transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    padding-top: 70px;
}
.sidebar nav a {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: #e0f4fc;
    font-size: 15px;
    font-weight: 600;
    padding: 13px 24px;
    border-left: 3px solid transparent;
    transition: background 0.2s, border-color 0.2s;
}
.sidebar nav a:hover {
    background: rgba(255,255,255,0.1);
    border-color: #7de0ff;
}
.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 998;
}
body.sidebar-open .overlay { display: block; }
body.sidebar-open .sidebar { left: 0; }
.homework-dropdown {
    display: flex;
    flex-direction: column;
    background: rgba(0,0,0,0.15);
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease;
}
.homework-dropdown a {
    font-size: 13px !important;
    padding: 10px 24px 10px 36px !important;
    border-left: 3px solid transparent;
    color: #c9eaf5 !important;
    font-weight: 400 !important;
}
.homework-dropdown a:hover {
    background: rgba(255,255,255,0.08);
    border-color: #7de0ff !important;
}
.homework-dropdown.open {
    max-height: 400px;
}
.montage-container {
    max-width: 900px;
    margin: 30px auto;
    padding: 20px;
    border: 2px solid #000;
    border-radius: 8px;
    background-color: #44b1cccc;
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: center;
}
.montage-main img {
  width: 750px;
  max-width: 100%;
  height: auto;
    border-radius: 4px;
}
.montage-secondary img {
  width: 350px;
  max-width: 100%;
  height: auto;
  border-radius: 4px;
  border: 2px solid #000;
}
.image-label {
    font-size: 18px;
    font-weight: bold;
    margin-top: 10px;
    text-align: center;
}
.montage-secondary {
  text-align: center;
}
body.sidebar-open .menu-toggle span:nth-child(1) {
    transform: translateY(7.5px) rotate(45deg);
}
body.sidebar-open .menu-toggle span:nth-child(2) {
    opacity: 0;
}
body.sidebar-open .menu-toggle span:nth-child(3) {
    transform: translateY(-7.5px) rotate(-45deg);
}
    </style>
</head>
<body>
    <button class="menu-toggle" onclick="toggleSidebar()">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <div class="sidebar" id="sidebar">
        <nav>
            <a href="index.html" onclick="closeSidebar()"> Home</a>
            <a href="#" onclick="toggleHomeworks(event)"> Homeworks
                <span id="homeworkArrow" style="display:inline-block; transition: transform 0.35s ease;">&#9660;</span>
            </a>
            <div class="homework-dropdown" id="homeworkDropdown">
                <a href="reading1.html">Reading 1: Plato's Cave</a>
                <a href="reading2.html">Reading 2: AI Slop</a>
                <a href="Homework%203.html">Homework 3: Depth of Field</a>
                <a href="homework4.html">Homework 4: Photo Montage</a>
                <a href="homework5.html">Homework 5: My Eye</a>
                <a href="homework6.html">Homework 6: Pattern T-Shirt</a>
            </div>
            <a href="https://www.linkedin.com/in/mason-riehm/" target="_blank">LinkedIn</a>
            <a href="index.html#extracurricular" onclick="closeSidebar()"> Extracurricular Coding</a>
        </nav>
    </div>

    <div class="overlay" onclick="closeSidebar()"></div>


        <header style="text-align: center;"><b>My Eye (work in progress)</b></header>
    <br>
        <p style="text-align: center; text-indent: 15px; width:900px; margin:auto; font-size: 14px;">
        </p>

    <div class="montage-container">
        <div class="montage-main">
        <img src="mason-eye.png" alt="Eye Illustrator">
    </div>
    </div>
</body>

        <script>
    function toggleSidebar() {
        document.body.classList.toggle('sidebar-open');
    }
    function closeSidebar() {
        document.body.classList.remove('sidebar-open');
    }
    function toggleHomeworks(event) {
        event.preventDefault();
        const dropdown = document.getElementById('homeworkDropdown');
        const arrow = document.getElementById('homeworkArrow');
        dropdown.classList.toggle('open');
        arrow.style.transform = dropdown.classList.contains('open')
            ? 'rotate(180deg)'
            : 'rotate(0deg)';
    }
</script>

</body>
