<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="media/website-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Montage</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .montage-container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            border: 2px solid #000;
            border-radius: 8px;
            background-color: #44b1cccc;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }
        .montage-main img {
            width: 750px;
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            border: 2px solid #000;
        }
        .montage-secondary img {
            width: 350px;
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            border: 2px solid #000;
        }
        .image-label {
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
            text-align: center;
        }
        .montage-secondary {
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="sidebar-container"></div>
    <script>
        fetch('sidebar.html')
            .then(res => res.text())
            .then(html => {
                const container = document.getElementById('sidebar-container');
                container.innerHTML = html;
                container.querySelectorAll('script').forEach(oldScript => {
                    const newScript = document.createElement('script');
                    newScript.textContent = oldScript.textContent;
                    document.body.appendChild(newScript);
                });
            });
    </script>

    <header style="text-align: center;"><b>Photo Montage</b></header>
    <br>

    <div class="montage-container">
        <div class="montage-main">
            <img src="media/whos-in-control.png" alt="Montage">
            <div class="image-label">Photo Montage</div>
        </div>
        <div class="montage-secondary">
            <img src="media/filters-control.png" alt="Layers">
            <div class="image-label">Layers</div>
        </div>
    </div>

</body>
</html>
