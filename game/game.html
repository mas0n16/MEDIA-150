<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Day Off</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f5f0e8;
    --warm-white: #faf7f2;
    --amber: #c8873a;
    --amber-light: #e8a855;
    --brown: #3d2b1f;
    --brown-mid: #6b4c38;
    --dusk: #7b6fa0;
    --night: #1a1630;
    --sage: #7a9e7e;
    --text: #2e1f14;
    --muted: #8c7060;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    overflow-x: hidden;
    position: relative;
  }

  /* ═══════════════════════════════════════
     PIXEL SCENE VIEWPORT
     ═══════════════════════════════════════ */
  .scene-viewport {
    width: 100%;
    aspect-ratio: 4 / 3;
    max-height: 55vh;
    position: relative;
    overflow: hidden;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    transition: opacity 0.6s ease;
  }

  .scene-viewport.fading { opacity: 0; }

  .scene-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .scene-bg canvas {
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
  }

  /* Grain overlay on scene */
  .scene-viewport::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    opacity: 0.15;
    pointer-events: none;
    z-index: 5;
  }

  /* Character canvas layer */
  .character-layer {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
  }

  .character-layer canvas {
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* Choice markers in the scene */
  .scene-choices {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-around;
    padding: 0 10%;
    z-index: 4;
    pointer-events: none;
  }

  .scene-choice-marker {
    pointer-events: all;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 10px 18px 16px;
    transition: transform 0.2s ease;
    position: relative;
  }

  .scene-choice-marker:hover { transform: translateY(-4px); }

  .marker-bubble {
    background: rgba(250,247,242,0.92);
    backdrop-filter: blur(8px);
    border: 2px solid var(--amber);
    border-radius: 12px;
    padding: 10px 16px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(61,43,31,0.2);
    min-width: 120px;
    max-width: 180px;
    transition: all 0.2s ease;
  }

  .scene-choice-marker:hover .marker-bubble {
    background: rgba(255,255,255,0.98);
    box-shadow: 0 6px 28px rgba(200,135,58,0.35);
    border-color: var(--amber-light);
  }

  .marker-icon { font-size: 20px; margin-bottom: 2px; }

  .marker-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: var(--brown);
    line-height: 1.3;
  }

  .marker-arrow {
    width: 0;
    height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 8px solid var(--amber);
  }

  /* Bounce animation on markers */
  .scene-choice-marker {
    animation: markerBounce 2s ease-in-out infinite;
  }

  .scene-choice-marker:nth-child(2) {
    animation-delay: 0.3s;
  }

  @keyframes markerBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .scene-choice-marker:hover {
    animation: none;
    transform: translateY(-4px);
  }

  /* ═══════════════════════════════════════
     BOTTOM PANEL (story text + UI)
     ═══════════════════════════════════════ */
  .bottom-panel {
    width: 100%;
    position: relative;
    z-index: 10;
    background: var(--cream);
    border-top: 3px solid var(--amber);
    min-height: 45vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .panel-inner {
    max-width: 580px;
    width: 100%;
    padding: 28px 24px 40px;
    opacity: 0;
    transform: translateY(12px);
    animation: slideUp 0.5s cubic-bezier(0.22,1,0.36,1) 0.3s forwards;
  }

  /* Night mode */
  body.time-night .bottom-panel {
    background: #1a1630;
    border-top-color: #6a5acd;
  }

  body.time-night .bottom-panel * {
    color: #e8e0f5;
  }

  body.time-night .marker-bubble {
    background: rgba(26,22,48,0.92);
    border-color: #9b8ee0;
  }

  body.time-night .marker-label { color: #e8e0f5; }
  body.time-night .marker-arrow { border-top-color: #9b8ee0; }

  /* Time bar */
  .time-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }

  .time-dots { display: flex; gap: 6px; }

  .time-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(61,43,31,0.15);
    transition: all 0.4s ease;
  }
  .time-dot.active { background: var(--amber); transform: scale(1.3); }
  .time-dot.done { background: var(--brown-mid); opacity: 0.4; }

  body.time-night .time-dot { background: rgba(232,224,245,0.15); }
  body.time-night .time-dot.active { background: var(--amber-light); }
  body.time-night .time-dot.done { background: rgba(232,224,245,0.3); }

  .time-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
  }

  body.time-night .time-label { color: rgba(232,224,245,0.5); }

  .stage-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 10px;
    display: block;
  }

  body.time-night .stage-label { color: var(--amber-light); }

  .story-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(26px, 5vw, 36px);
    font-weight: 600;
    line-height: 1.15;
    color: var(--brown);
    margin-bottom: 14px;
    letter-spacing: -0.01em;
  }

  body.time-night .story-title { color: #f0eaff; }

  .story-text {
    font-size: 14px;
    line-height: 1.75;
    color: var(--brown-mid);
    font-weight: 300;
  }

  body.time-night .story-text { color: rgba(232,224,245,0.65); }

  .hint-text {
    font-size: 11px;
    color: var(--muted);
    margin-top: 16px;
    font-style: italic;
    opacity: 0.7;
  }

  body.time-night .hint-text { color: rgba(232,224,245,0.35); }

  /* Ending */
  .ending-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, var(--amber), var(--amber-light));
    color: white;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 20px;
    margin-bottom: 16px;
  }

  body.time-night .ending-badge {
    background: linear-gradient(135deg, #6a5acd, #9b8ee0);
  }

  .ending-score {
    font-family: 'Cormorant Garamond', serif;
    font-size: 52px;
    font-weight: 300;
    font-style: italic;
    color: var(--amber);
    line-height: 1;
    margin: 16px 0 4px;
  }

  body.time-night .ending-score { color: #c9b8ff; }

  .ending-score-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--muted);
    margin-bottom: 24px;
  }

  .restart-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--brown);
    color: var(--cream);
    border: none;
    border-radius: 30px;
    padding: 14px 28px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.05em;
    cursor: pointer;
    margin-top: 8px;
    transition: all 0.2s ease;
  }

  body.time-night .restart-btn {
    background: rgba(232,224,245,0.12);
    color: #e8e0f5;
    border: 1px solid rgba(232,224,245,0.2);
  }

  .restart-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(61,43,31,0.25);
  }

  .path-trail {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid rgba(61,43,31,0.08);
  }

  body.time-night .path-trail { border-top-color: rgba(232,224,245,0.08); }

  .trail-item {
    font-size: 10px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  body.time-night .trail-item { color: rgba(232,224,245,0.35); }

  .trail-item::after { content: '→'; margin-left: 4px; opacity: 0.5; }
  .trail-item:last-child::after { display: none; }

  /* Ending overlay bubble inside the scene */
  .ending-overlay {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 10;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(2px);
  }

  .ending-overlay.visible {
    display: flex;
    animation: slideUp 0.5s cubic-bezier(0.22,1,0.36,1) both;
  }

  .ending-bubble {
    background: rgba(250,247,242,0.96);
    border: 2px solid var(--amber);
    border-radius: 18px;
    padding: 22px 26px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 40px rgba(61,43,31,0.35);
  }

  body.time-night .ending-bubble {
    background: rgba(26,22,48,0.97);
    border-color: #6a5acd;
  }

  .ending-bubble .ending-badge { margin-bottom: 10px; }

  .ending-bubble .story-title {
    font-size: clamp(18px, 3vw, 24px);
    margin-bottom: 8px;
  }

  .ending-bubble .story-text {
    font-size: 12px;
    line-height: 1.65;
    margin-bottom: 10px;
  }

  .ending-bubble .ending-score {
    font-size: 36px;
    margin: 8px 0 2px;
  }

  .ending-bubble .ending-score-label {
    margin-bottom: 14px;
  }

  .ending-bubble .path-trail {
    margin-top: 12px;
    padding-top: 10px;
    justify-content: center;
  }

  /* Title screen overrides */
  .title-mode .panel-inner { text-align: center; }

  .title-eyebrow {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--amber);
    font-weight: 500;
    margin-bottom: 8px;
    display: block;
  }

  .title-mode .story-title {
    font-size: clamp(34px, 7vw, 48px);
    font-style: italic;
    margin-bottom: 10px;
  }

  .title-sub {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 17px;
    color: var(--muted);
    margin-bottom: 24px;
  }

  .start-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, var(--amber), #d4924a);
    color: white;
    border: none;
    border-radius: 30px;
    padding: 16px 36px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: 0 4px 20px rgba(200,135,58,0.35);
  }

  .start-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(200,135,58,0.45);
  }

  @keyframes slideUp {
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body class="time-morning">

<div class="scene-viewport" id="sceneViewport">
  <div class="scene-bg"><canvas id="bgCanvas"></canvas></div>
  <div class="character-layer"><canvas id="charCanvas"></canvas></div>
  <div class="scene-choices" id="sceneChoices"></div>
  <div class="ending-overlay" id="endingOverlay">
    <div class="ending-bubble" id="endingBubble"></div>
  </div>
</div>

<div class="bottom-panel" id="bottomPanel">
  <div class="panel-inner" id="panelInner"></div>
</div>

<script>
// ═══════════════════════════════════════════════
// PIXEL ART RENDERING ENGINE
// ═══════════════════════════════════════════════

const PX = 4; // each "pixel" is 4x4 real pixels on the low-res canvas
const SCENE_W = 160;
const SCENE_H = 120;

const bgCanvas = document.getElementById('bgCanvas');
const bgCtx = bgCanvas.getContext('2d');
bgCanvas.width = SCENE_W;
bgCanvas.height = SCENE_H;

const charCanvas = document.getElementById('charCanvas');
const charCtx = charCanvas.getContext('2d');
charCanvas.width = SCENE_W;
charCanvas.height = SCENE_H;

// ─── COLOR PALETTES ───
const PAL = {
  // Character
  skin: '#f0c8a0',
  skinShade: '#d4a878',
  hair: '#5c3a1e',
  hairLight: '#7a5030',
  shirtMain: '#3a8a6a',
  shirtLight: '#50b888',
  shirtDark: '#2a6a50',
  pants: '#3a5a8a',
  pantsLight: '#4a70a0',
  pantsDark: '#2a4a70',
  shoes: '#4a4040',
  shoesLight: '#6a5a55',

  // Scenes
  skyMorning1: '#ffe8b0', skyMorning2: '#ffd480',
  skyMidday1: '#90d0f0', skyMidday2: '#b8e4ff',
  skyAfternoon1: '#ffc888', skyAfternoon2: '#ff9060',
  skyEvening1: '#c07888', skyEvening2: '#7050a0',
  skyNight1: '#1a1830', skyNight2: '#282050',

  sunYellow: '#ffe060',
  sunOrange: '#ffa830',
  cloud: '#fff8f0',
  cloudShade: '#e8ddd0',

  // Buildings
  bldgLight: '#e8d8c0', bldgMid: '#c0a888', bldgDark: '#907860',
  bldg2: '#d0b898', bldg3: '#b09070',
  windowLit: '#fff0a0', windowDark: '#504838',
  roofDark: '#685040',

  // Nature
  treeTrunk: '#6a4830', treeGreen: '#50a050', treeGreenDark: '#388038', treeGreenLight: '#70c060',
  grass: '#60a850', grassDark: '#48883a', grassLight: '#80c870',
  path: '#d8c8a0', pathDark: '#c0b088',
  water: '#60a0d0', waterLight: '#80c0e8', waterDark: '#4080b0',

  // Interior
  floor: '#c8b090', floorDark: '#a89070',
  wallInt: '#e8dcc8', wallInt2: '#d8ccb0',
  furniture: '#8a7050', furnitureLight: '#a89070',
  bedWhite: '#f0ece0', bedBlue: '#7090c0',
};

// ─── PIXEL DRAWING HELPERS ───
function px(ctx, x, y, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, 1, 1);
}

function rect(ctx, x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
}

function line(ctx, x1, y1, x2, y2, color) {
  ctx.fillStyle = color;
  const dx = Math.abs(x2 - x1), dy = Math.abs(y2 - y1);
  const sx = x1 < x2 ? 1 : -1, sy = y1 < y2 ? 1 : -1;
  let err = dx - dy;
  while (true) {
    ctx.fillRect(x1, y1, 1, 1);
    if (x1 === x2 && y1 === y2) break;
    const e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x1 += sx; }
    if (e2 < dx) { err += dx; y1 += sy; }
  }
}

// ─── SKY GRADIENT (vertical) ───
function drawSky(ctx, col1, col2) {
  const r1 = parseInt(col1.slice(1,3),16), g1 = parseInt(col1.slice(3,5),16), b1 = parseInt(col1.slice(5,7),16);
  const r2 = parseInt(col2.slice(1,3),16), g2 = parseInt(col2.slice(3,5),16), b2 = parseInt(col2.slice(5,7),16);
  for (let y = 0; y < 70; y++) {
    const t = y / 70;
    const r = Math.round(r1 + (r2 - r1) * t);
    const g = Math.round(g1 + (g2 - g1) * t);
    const b = Math.round(b1 + (b2 - b1) * t);
    rect(ctx, 0, y, SCENE_W, 1, `rgb(${r},${g},${b})`);
  }
}

// ─── CLOUDS ───
function drawCloud(ctx, x, y, size) {
  const s = size;
  rect(ctx, x, y, s*3, s, PAL.cloud);
  rect(ctx, x+s, y-s, s*2, s, PAL.cloud);
  rect(ctx, x-1, y+1, s*3+2, 1, PAL.cloudShade);
}

// ─── SIMPLE TREE ───
function drawTree(ctx, x, y) {
  rect(ctx, x+2, y+5, 2, 5, PAL.treeTrunk);
  rect(ctx, x, y+1, 6, 5, PAL.treeGreen);
  rect(ctx, x+1, y, 4, 2, PAL.treeGreenDark);
  px(ctx, x+2, y, PAL.treeGreenLight);
  px(ctx, x+4, y+2, PAL.treeGreenLight);
}

// ─── SUN / MOON ───
function drawSun(ctx, x, y) {
  rect(ctx, x, y, 6, 6, PAL.sunYellow);
  rect(ctx, x+1, y+1, 4, 4, PAL.sunOrange);
}

function drawMoon(ctx, x, y) {
  rect(ctx, x, y, 5, 5, '#e8e0c8');
  rect(ctx, x+1, y+1, 3, 3, '#f0ecd8');
  px(ctx, x+3, y+1, '#d8d0b8');
}

function drawStars(ctx) {
  const spots = [[10,8],[30,5],[55,12],[80,3],[100,10],[130,7],[145,15],[20,20],[70,18],[110,22],[42,6],[90,14],[120,4]];
  spots.forEach(([sx,sy]) => {
    px(ctx, sx, sy, Math.random() > 0.5 ? '#e8e0f0' : '#c0b8d8');
  });
}

// ─── BUILDING ───
function drawBuilding(ctx, x, y, w, h, color, windowColor) {
  rect(ctx, x, y, w, h, color);
  rect(ctx, x, y, w, 2, PAL.roofDark);
  // windows
  for (let wy = y + 4; wy < y + h - 3; wy += 5) {
    for (let wx = x + 2; wx < x + w - 2; wx += 4) {
      rect(ctx, wx, wy, 2, 2, windowColor);
    }
  }
}

// ═══════════════════════════════════════════════
// SCENE DRAWING FUNCTIONS
// ═══════════════════════════════════════════════

const scenes = {
  bedroom: (ctx) => {
    drawSky(ctx, PAL.skyMorning1, PAL.skyMorning2);
    drawSun(ctx, 130, 10);
    drawCloud(ctx, 20, 12, 3);
    drawCloud(ctx, 90, 8, 2);
    // Room interior
    rect(ctx, 0, 50, SCENE_W, 70, PAL.wallInt);
    rect(ctx, 0, 85, SCENE_W, 35, PAL.floor);
    rect(ctx, 0, 84, SCENE_W, 2, PAL.floorDark);
    // Window
    rect(ctx, 100, 54, 24, 28, '#c8e8ff');
    rect(ctx, 99, 53, 26, 1, PAL.furniture);
    rect(ctx, 99, 82, 26, 1, PAL.furniture);
    rect(ctx, 99, 53, 1, 30, PAL.furniture);
    rect(ctx, 125, 53, 1, 30, PAL.furniture);
    rect(ctx, 111, 53, 1, 30, PAL.furniture);
    // Bed
    rect(ctx, 10, 78, 40, 16, PAL.bedBlue);
    rect(ctx, 10, 76, 40, 3, PAL.bedWhite);
    rect(ctx, 8, 70, 4, 24, PAL.furniture);
    rect(ctx, 48, 70, 4, 24, PAL.furniture);
    // Pillow
    rect(ctx, 12, 74, 10, 4, PAL.bedWhite);
    // Nightstand
    rect(ctx, 56, 80, 12, 14, PAL.furniture);
    rect(ctx, 58, 78, 8, 3, PAL.furnitureLight);
    // Lamp
    rect(ctx, 60, 70, 4, 8, '#d8c898');
    rect(ctx, 58, 68, 8, 3, '#f0e8c0');
    // Rug
    rect(ctx, 70, 96, 30, 8, '#c07060');
    rect(ctx, 72, 98, 26, 4, '#d08878');
    // Ground shadow
    rect(ctx, 0, SCENE_H-2, SCENE_W, 2, PAL.floorDark);
  },

  street_morning: (ctx) => {
    drawSky(ctx, PAL.skyMorning1, PAL.skyMorning2);
    drawSun(ctx, 20, 8);
    drawCloud(ctx, 60, 6, 3);
    drawCloud(ctx, 110, 14, 2);
    // Buildings bg
    drawBuilding(ctx, 0, 30, 22, 50, PAL.bldgLight, PAL.windowLit);
    drawBuilding(ctx, 24, 38, 18, 42, PAL.bldg2, PAL.windowDark);
    drawBuilding(ctx, 44, 32, 20, 48, PAL.bldgMid, PAL.windowLit);
    drawBuilding(ctx, 100, 35, 24, 45, PAL.bldg2, PAL.windowDark);
    drawBuilding(ctx, 126, 28, 34, 52, PAL.bldgLight, PAL.windowLit);
    // Sidewalk
    rect(ctx, 0, 80, SCENE_W, 10, '#d0c4a8');
    rect(ctx, 0, 79, SCENE_W, 1, '#b8a888');
    // Road

// CHARACTER SPRITE
// ═══════════════════════════════════════════════

const CHARACTER = {
  x: 80,
  y: 0,
  targetX: 80,
  frame: 0,
  facing: 1, // 1=right, -1=left
  walking: false,
  bobPhase: 0,
};

function drawCharacter(ctx, x, groundY, frame, facing) {
  ctx.save();
  const cx = Math.floor(x);
  const cy = Math.floor(groundY);

  // Walk bob
  const bob = CHARACTER.walking ? Math.sin(CHARACTER.bobPhase) * 1 : 0;
  const legSwing = CHARACTER.walking ? Math.sin(CHARACTER.bobPhase) * 2 : 0;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(cx - 3, cy + 1, 8, 2);

  // We draw at cx, cy where cy is feet position, so character goes upward
  const bx = cx; // base x (left foot area)
  const by = cy + Math.floor(bob); // base y adjusted for bob

  // Shoes / feet
  rect(ctx, bx, by - 2, 3, 2, PAL.shoes);
  rect(ctx, bx + Math.floor(legSwing > 0 ? legSwing : 0), by - 2, 3, 2, PAL.shoesLight);
  // If facing left, mirror
  if (facing < 0) {
    rect(ctx, bx + 1, by - 2, 3, 2, PAL.shoes);
    rect(ctx, bx + 1 + Math.floor(legSwing < 0 ? -legSwing : 0), by - 2, 3, 2, PAL.shoesLight);
  }

  // Legs (pants)
  rect(ctx, bx, by - 7, 3, 5, PAL.pants);
  rect(ctx, bx + 2, by - 7, 3, 5, PAL.pantsLight);

  // Torso (shirt)
  rect(ctx, bx - 1, by - 13, 7, 6, PAL.shirtMain);
  rect(ctx, bx, by - 13, 5, 6, PAL.shirtLight);
  rect(ctx, bx + 1, by - 12, 3, 4, PAL.shirtMain);
  // Shirt collar
  rect(ctx, bx + 1, by - 13, 3, 1, PAL.shirtDark);

  // Arms
  const armSwing = CHARACTER.walking ? Math.sin(CHARACTER.bobPhase + 1.5) * 1 : 0;
  rect(ctx, bx - 2, by - 12 + Math.floor(armSwing), 2, 5, PAL.shirtDark);
  rect(ctx, bx + 5, by - 12 - Math.floor(armSwing), 2, 5, PAL.shirtDark);
  // Hands
  px(ctx, bx - 2, by - 7 + Math.floor(armSwing), PAL.skin);
  px(ctx, bx + 6, by - 7 - Math.floor(armSwing), PAL.skin);

  // Head
  rect(ctx, bx, by - 18, 5, 5, PAL.skin);
  rect(ctx, bx + 1, by - 17, 3, 3, PAL.skinShade);
  // Eyes
  if (facing >= 0) {
    px(ctx, bx + 3, by - 16, '#2a1a10');
    px(ctx, bx + 1, by - 16, '#2a1a10');
  } else {
    px(ctx, bx + 1, by - 16, '#2a1a10');
    px(ctx, bx + 3, by - 16, '#2a1a10');
  }

  // Hair
  rect(ctx, bx - 1, by - 20, 7, 3, PAL.hair);
  rect(ctx, bx, by - 21, 5, 2, PAL.hair);
  rect(ctx, bx + 1, by - 21, 3, 1, PAL.hairLight);
  // Side hair
  if (facing >= 0) {
    rect(ctx, bx - 1, by - 18, 1, 3, PAL.hair);
  } else {
    rect(ctx, bx + 5, by - 18, 1, 3, PAL.hair);
  }

  ctx.restore();
}

// ═══════════════════════════════════════════════
// ANIMATION LOOP
// ═══════════════════════════════════════════════

let animFrame = 0;
let onArriveCallback = null;
const WALK_SPEED = 0.8;
const GROUND_Y_RATIO = 0.82; // character stands at 82% of scene height

function updateCharacter() {
  const dx = CHARACTER.targetX - CHARACTER.x;
  if (Math.abs(dx) > 1) {
    CHARACTER.walking = true;
    CHARACTER.facing = dx > 0 ? 1 : -1;
    CHARACTER.x += Math.sign(dx) * WALK_SPEED;
    CHARACTER.bobPhase += 0.35;
  } else {
    if (CHARACTER.walking && onArriveCallback) {
      CHARACTER.walking = false;
      const cb = onArriveCallback;
      onArriveCallback = null;
      setTimeout(cb, 200);
    }
    CHARACTER.walking = false;
  }
}

function renderLoop() {
  charCtx.clearRect(0, 0, SCENE_W, SCENE_H);
  updateCharacter();
  const groundY = Math.floor(SCENE_H * GROUND_Y_RATIO);
  drawCharacter(charCtx, CHARACTER.x, groundY, animFrame, CHARACTER.facing);
  animFrame++;
  requestAnimationFrame(renderLoop);
}

function drawScene(sceneKey) {
  bgCtx.clearRect(0, 0, SCENE_W, SCENE_H);
  if (scenes[sceneKey]) {
    scenes[sceneKey](bgCtx);
  }
}

// ═══════════════════════════════════════════════
// GAME ENGINE
// ═══════════════════════════════════════════════

let pathTaken = [];
let currentStage = 'start';
let activeChoices = [];

const timeClasses = {
  morning: 'time-morning',
  midday: 'time-midday',
  afternoon: 'time-afternoon',
  evening: 'time-evening',
  night: 'time-night'
};

function setTimeClass(time) {
  document.body.className = timeClasses[time] || 'time-morning';
}

function getTimeDots(stageNum) {
  const labels = ['Morning', 'Midday', 'Afternoon', 'Evening', 'Night'];
  return `
    <div class="time-bar">
      <div class="time-dots">
        ${labels.map((_, i) => `
          <div class="time-dot ${i < stageNum ? 'done' : i === stageNum ? 'active' : ''}"></div>
        `).join('')}
      </div>
      <span class="time-label">${labels[stageNum] || 'Night'}</span>
    </div>
  `;
}

function placeChoiceMarkers(choices) {
  const container = document.getElementById('sceneChoices');
  if (!choices || choices.length === 0) {
    container.innerHTML = '';
    return;
  }
  container.innerHTML = choices.map((c, i) => `
    <div class="scene-choice-marker" data-next="${c.next}" data-index="${i}" data-target-x="${i === 0 ? 40 : 120}">
      <div class="marker-bubble">
        <div class="marker-icon">${c.icon}</div>
        <div class="marker-label">${c.label}</div>
      </div>
      <div class="marker-arrow"></div>
    </div>
  `).join('');

  container.querySelectorAll('.scene-choice-marker').forEach(marker => {
    marker.addEventListener('click', () => {
      const next = marker.dataset.next;
      const idx = parseInt(marker.dataset.index);
      const targetX = parseInt(marker.dataset.targetX);
      const label = activeChoices[idx] ? activeChoices[idx].label : '';
      pathTaken.push(label);

      // Remove markers
      container.innerHTML = '';

      // Walk character toward the choice
      CHARACTER.targetX = targetX;
      onArriveCallback = () => {
        currentStage = next;
        transitionToStage(next);
      };
    });
  });
}

function transitionToStage(key) {
  const viewport = document.getElementById('sceneViewport');
  const panel = document.getElementById('panelInner');

  // Fade out
  viewport.classList.add('fading');
  panel.style.opacity = '0';
  panel.style.transform = 'translateY(12px)';
  panel.style.transition = 'opacity 0.3s ease, transform 0.3s ease';

  setTimeout(() => {
    const node = story[key];
    setTimeClass(node.time);
    const sceneKey = sceneMap[key] || 'bedroom';
    drawScene(sceneKey);

    // Reset character position
    CHARACTER.x = 80;
    CHARACTER.targetX = 80;
    CHARACTER.walking = false;

    // Render panel
    renderPanel(key);

    // Fade in
    setTimeout(() => {
      viewport.classList.remove('fading');
      panel.style.opacity = '1';
      panel.style.transform = 'translateY(0)';

      // Place choice markers after fade in
      setTimeout(() => {
        if (node.choices) {
          placeChoiceMarkers(node.choices);
        }
      }, 300);
    }, 100);
  }, 500);
}

function renderPanel(key) {
  const panel = document.getElementById('panelInner');
  const node = story[key];
  activeChoices = node.choices || [];

  if (node.isStart) {
    document.getElementById('bottomPanel').classList.add('title-mode');
    panel.innerHTML = `
      ${getTimeDots(0)}
      <span class="title-eyebrow">${node.eyebrow}</span>
      <h1 class="story-title">${node.title}</h1>
      <p class="title-sub">No plans. No alarms. Just choices.</p>
      <p class="story-text">${node.text}</p>
      <p class="hint-text">↑ Click a choice in the scene above</p>
    `;
    return;
  }

  document.getElementById('bottomPanel').classList.remove('title-mode');

  if (node.isEnding) {
    // Show ending in the scene bubble overlay
    const overlay = document.getElementById('endingOverlay');
    const bubble = document.getElementById('endingBubble');
    bubble.innerHTML = `
      <span class="ending-badge">✦ End of Your Day</span>
      <h2 class="story-title">${node.title}</h2>
      <p class="story-text">${node.text}</p>
      <div class="ending-score">${node.score}</div>
      <div class="ending-score-label">${node.scoreLabel}</div>
      <button class="restart-btn" id="restartBtn">↺ &nbsp;Try a different day</button>
      ${pathTaken.length ? `
        <div class="path-trail">
          ${pathTaken.map(p => `<span class="trail-item">${p}</span>`).join('')}
          <span class="trail-item">${node.endingIcon} ${node.title}</span>
        </div>
      ` : ''}
    `;
    overlay.classList.add('visible');
    document.getElementById('restartBtn').addEventListener('click', restart);
    // Clear the bottom panel
    panel.innerHTML = `${getTimeDots(4)}`;
    return;
  }

  panel.innerHTML = `
    ${getTimeDots(node.stage)}
    <span class="stage-label">${node.timeLabel}</span>
    <h2 class="story-title">${node.title}</h2>
    <p class="story-text">${node.text}</p>
    <p class="hint-text">↑ Click a choice in the scene above</p>
  `;
}

function restart() {
  pathTaken = [];
  currentStage = 'start';
  CHARACTER.x = 80;
  CHARACTER.targetX = 80;
  CHARACTER.walking = false;
  document.getElementById('endingOverlay').classList.remove('visible');
  transitionToStage('start');
}

drawScene('bedroom');
renderPanel('start');
