<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pattern T-Shirt</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .montage-container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            border: 2px solid #000;
            border-radius: 8px;
            background-color: #44b1cccc;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }
        .montage-main img {
            width: 400px;
            height: 500px;
            max-width: 100%;
            object-fit: contain;
            border-radius: 4px;
        }
        .preview-strip {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .preview-thumb {
            width: 120px;
            height: auto;
            border-radius: 4px;
            border: 3px solid transparent;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s, border-color 0.2s;
        }
        .preview-thumb:hover {
            opacity: 1;
        }
        .preview-thumb.active {
            border-color: #0099cc;
            opacity: 1;
        }
    </style>
</head>
<body>

    <div id="sidebar-container"></div>
    <script>
        fetch('sidebar.html')
            .then(res => res.text())
            .then(html => {
                const container = document.getElementById('sidebar-container');
                container.innerHTML = html;
                container.querySelectorAll('script').forEach(oldScript => {
                    const newScript = document.createElement('script');
                    newScript.textContent = oldScript.textContent;
                    document.body.appendChild(newScript);
                });
            });
    </script>

    <header style="text-align: center;"><b>Pattern T-Shirt</b></header>
    <br>

    <div class="montage-container">
        <div class="montage-main">
            <img id="mainDisplay" src="shirt2.png" alt="First Shirt Design">
        </div>
        <div class="preview-strip">
            <img src="media/shirt2.png" alt="Shirt 1" class="preview-thumb active" onclick="switchImage(this, 'shirt2.png')">
            <img src="media/shirtdes2.png" alt="Shirt 2" class="preview-thumb" onclick="switchImage(this, 'shirtdes2.png')">
        </div>
    </div>

    <script>
        function switchImage(thumb, src) {
            document.getElementById('mainDisplay').src = src;
            document.querySelectorAll('.preview-thumb').forEach(t => t.classList.remove('active'));
            thumb.classList.add('active');
        }
    </script>

</body>
</html>
