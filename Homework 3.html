<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depth of Field</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .before-after-container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            border: 2px solid #000;
            border-radius: 8px;
            background-color: #44b1cccc;
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        .image-box {
            text-align: center;
        }
        .image-box img {
            width: 350px;
            height: auto;
            border-radius: 4px;
            border: 2px solid #000;
        }
        .image-label {
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
        }
        .montage-container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            border: 2px solid #000;
            border-radius: 8px;
            background-color: #44b1cccc;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }
        .montage-main img {
            width: 750px;
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            border: 2px solid #000;
        }
    </style>
</head>
<body>

    <div id="sidebar-container"></div>
    <script>
        fetch('sidebar.html')
            .then(res => res.text())
            .then(html => {
                const container = document.getElementById('sidebar-container');
                container.innerHTML = html;
                container.querySelectorAll('script').forEach(oldScript => {
                    const newScript = document.createElement('script');
                    newScript.textContent = oldScript.textContent;
                    document.body.appendChild(newScript);
                });
            });
    </script>

    <header style="text-align: center;"><b>Homework 3</b></header>
    <p style="text-align: center;"><b>Depth of Field and Camera Raw</b></p>

    <p style="text-align: center; font-weight: bold; font-size: 16px; margin-bottom: -20px;">Edits with Camera Raw</p>
    <div class="before-after-container">
        <div class="image-box">
            <img src="media/IMG_0713.jpg" alt="Before Image">
            <div class="image-label">Before</div>
        </div>
        <div class="image-box">
            <img src="media/EDITED212.png" alt="After Image">
            <div class="image-label">After</div>
        </div>
    </div>

    <p style="text-align: center; font-weight: bold; font-size: 16px; margin-bottom: -20px;">Edits with Camera Raw</p>
    <div class="before-after-container">
        <div class="image-box">
            <img src="media/IMG_0738 copy.JPG" alt="Before">
            <div class="image-label">Before</div>
        </div>
        <div class="image-box">
            <img src="media/IMG_0738edit.jpg" alt="After">
            <div class="image-label">After</div>
        </div>
    </div>

    <p style="text-align: center; font-weight: bold; font-size: 16px; margin-bottom: -20px;">Blur with Photoshop</p>
    <div class="before-after-container">
        <div class="image-box">
            <img src="media/IMG_0728 copy 2.JPG" alt="Before">
            <div class="image-label">Before</div>
        </div>
        <div class="image-box">
            <img src="media/IMG_0728 blur.png" alt="After">
            <div class="image-label">After</div>
        </div>
    </div>

    <p style="text-align: center; font-weight: bold; font-size: 16px; margin-bottom: -20px;">Shallow Depth of Field with Camera</p>
    <div class="montage-container">
        <div class="montage-main">
            <img src="media/IMG_0760 copy.JPG" alt="Shallow DOF">
        </div>
    </div>

</body>
</html>
