<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="media/website-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depth of Field</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .page-header {
            text-align: center;
            margin-top: 10px;
        }
        .page-header h1 {
            font-size: 22px;
            font-weight: bold;
            margin: 0 0 4px;
        }
        .page-header p {
            font-size: 15px;
            margin: 0 0 24px;
        }
        .section-label {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            margin: 30px 0 10px;
        }
        .before-after-container {
            max-width: 900px;
            margin: 0 auto 30px;
            padding: 20px;
            border: 1.5px solid #444;
            border-radius: 8px;
            background-color: #44b1cccc;
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        .image-box {
            text-align: center;
        }
        .image-box img {
            width: 350px;
            height: auto;
            border-radius: 4px;
            border: 1.5px solid #444;
        }
        .image-label {
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
        }
        .montage-container {
            max-width: 900px;
            margin: 0 auto 50px;
            padding: 20px;
            border: 1.5px solid #444;
            border-radius: 8px;
            background-color: #44b1cccc;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }
        .montage-main img {
            width: 100%;
            max-width: 750px;
            height: auto;
            border-radius: 4px;
            border: 1.5px solid #444;
        }
    </style>
</head>
<body>

    <div id="sidebar-container"></div>
    <script>
        fetch('sidebar.html')
            .then(res => res.text())
            .then(html => {
                const container = document.getElementById('sidebar-container');
                container.innerHTML = html;
                container.querySelectorAll('script').forEach(oldScript => {
                    const newScript = document.createElement('script');
                    newScript.textContent = oldScript.textContent;
                    document.body.appendChild(newScript);
                });
            });
    </script>

    <div class="page-header">
        <h1>Homework 3</h1>
        <p>Depth of Field and Camera Raw</p>
    </div>

    <h2 class="section-label">Camera Raw Edit — Set 1</h2>
    <div class="before-after-container">
        <div class="image-box">
            <img src="media/IMG_0713.jpg" alt="Before Image">
            <div class="image-label">Before</div>
        </div>
        <div class="image-box">
            <img src="media/EDITED212.png" alt="After Image">
            <div class="image-label">After</div>
        </div>
    </div>

    <h2 class="section-label">Camera Raw Edit — Set 2</h2>
    <div class="before-after-container">
        <div class="image-box">
            <img src="media/IMG_0738%20copy.JPG" alt="Before">
            <div class="image-label">Before</div>
        </div>
        <div class="image-box">
            <img src="media/IMG_0738edit.jpg" alt="After">
            <div class="image-label">After</div>
        </div>
    </div>

    <h2 class="section-label">Blur with Photoshop</h2>
    <div class="before-after-container">
        <div class="image-box">
            <img src="media/IMG_0728%20copy%202.JPG" alt="Before">
            <div class="image-label">Before</div>
        </div>
        <div class="image-box">
            <img src="media/IMG_0728%20blur.png" alt="After">
            <div class="image-label">After</div>
        </div>
    </div>

    <h2 class="section-label">Shallow Depth of Field with Camera</h2>
    <div class="montage-container">
        <div class="montage-main">
            <img src="media/IMG_0760%20copy.JPG" alt="Shallow DOF">
        </div>
    </div>

</body>
</html>
