<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extracurricular Coding</title>
    <style>
        body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    line-height: 1.6;
    margin: 20px;
    background-color: #8bcff0;
}
.menu-toggle {
    position: fixed;
    top: 18px;
    left: 20px;
    z-index: 1000;
    background: #0099cc;
    border: none;
    border-radius: 6px;
    width: 44px;
    height: 44px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
}
.menu-toggle span {
    display: block;
    width: 22px;
    height: 2.5px;
    background: #fff;
    border-radius: 2px;
    transition: transform 0.3s, opacity 0.3s;
}
.sidebar {
    position: fixed;
    top: 0;
    left: -270px;
    z-index: 999;
    width: 260px;
    height: 100%;
    background: #1a6e8e;
    box-shadow: 4px 0 18px rgba(0,0,0,0.25);
    transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    padding-top: 70px;
}
.sidebar nav a {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: #e0f4fc;
    font-size: 15px;
    font-weight: 600;
    padding: 13px 24px;
    border-left: 3px solid transparent;
    transition: background 0.2s, border-color 0.2s;
}
.sidebar nav a:hover {
    background: rgba(255,255,255,0.1);
    border-color: #7de0ff;
}
.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 998;
}
body.sidebar-open .overlay { display: block; }
body.sidebar-open .sidebar { left: 0; }
.homework-dropdown {
    display: flex;
    flex-direction: column;
    background: rgba(0,0,0,0.15);
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease;
}
.homework-dropdown a {
    font-size: 13px !important;
    padding: 10px 24px 10px 36px !important;
    border-left: 3px solid transparent;
    color: #c9eaf5 !important;
    font-weight: 400 !important;
}
.homework-dropdown a:hover {
    background: rgba(255,255,255,0.08);
    border-color: #7de0ff !important;
}
.homework-dropdown.open {
    max-height: 300px;
}
.before-after-container {
    max-width: 900px;
    margin: 30px auto;
    padding: 20px;
    border: 2px solid #000;
    border-radius: 8px;
    background-color: #44b1cccc;
    display: flex;
    gap: 20px;
    justify-content: center;
}

body.sidebar-open .menu-toggle span:nth-child(1) {
    transform: translateY(7.5px) rotate(45deg);
}
body.sidebar-open .menu-toggle span:nth-child(2) {
    opacity: 0;
}
body.sidebar-open .menu-toggle span:nth-child(3) {
    transform: translateY(-7.5px) rotate(-45deg);
}
    </style>
</head>
<body>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 20px">
    <a href="index.html" style="text-decoration: none; color: black; font-size: 32px; font-weight: bold;">
            Extracurricular Coding
         </a>
         <div style="width:80px;"></div>
</div>

<a href ="irtheorytest.html" >IR Theory Test</a>
    

<script>
    function toggleSidebar() {
        document.body.classList.toggle('sidebar-open');
    }
    function closeSidebar() {
        document.body.classList.remove('sidebar-open');
    }
    function toggleHomeworks(event) {
        event.preventDefault();
        const dropdown = document.getElementById('homeworkDropdown');
        const arrow = document.getElementById('homeworkArrow');
        dropdown.classList.toggle('open');
        arrow.style.transform = dropdown.classList.contains('open')
            ? 'rotate(180deg)'
            : 'rotate(0deg)';
    }
</script>
</body>
</html>
